spring.application.name=review-shop-backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/review-shop-dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.rate-limit-enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.password-reset.otp-ttl-minutes=${PASSWORD_RESET_OTP_TTL_MINUTES}
app.password-reset.otp-pepper=${PASSWORD_RESET_OTP_PEPPER}
app.password-reset.minimum-response-millis=${PASSWORD_RESET_MINIMUM_RESPONSE_MILLIS:300}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:review-shop-backend}
app.jwt.audience=${JWT_AUDIENCE:review-shop-api}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
app.jwt.refresh-token-cleanup-cron=${JWT_REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}
app.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
app.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
app.jwt.csrf-cookie-name=${JWT_CSRF_COOKIE_NAME:csrf_token}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.platform.default-fee-rate=${PLATFORM_DEFAULT_FEE_RATE:0.5000}
app.payout.encryption-key=${PAYOUT_ENCRYPTION_KEY:${JWT_SECRET}}
app.payout.withdrawal-minimum=${WITHDRAWAL_MINIMUM}
app.payout.withdrawal-fee=${WITHDRAWAL_FEE}
app.job-assignment.claim-ttl-minutes=${JOB_ASSIGNMENT_CLAIM_TTL_MINUTES:10}
app.job-assignment.expiry-cleanup-cron=${JOB_ASSIGNMENT_EXPIRY_CLEANUP_CRON:0 * * * * *}
app.serpapi.api-key=${SERPAPI_API_KEY:}
app.serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Platform Admin}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.storage.r2.endpoint=${R2_ENDPOINT}                                                                                                                                                                                            
app.storage.r2.access-key=${R2_ACCESS_KEY_ID}                                                                                                                                                                                     
app.storage.r2.secret-key=${R2_SECRET_ACCESS_KEY}                                                                                                                                                                                 
app.storage.r2.bucket=${R2_BUCKET_NAME}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.upload-url-duration=${R2_UPLOAD_URL_DURATION:PT10M}
app.storage.r2.download-url-duration=${R2_DOWNLOAD_URL_DURATION:PT30M}
app.storage.r2.max-image-size=${R2_MAX_IMAGE_SIZE:3145728}
app.sepay.enabled=${SEPAY_ENABLED:false}
app.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
app.sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
app.sepay.bank-code=${SEPAY_BANK_CODE:}
app.sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
app.sepay.payment-code-prefix=${SEPAY_PAYMENT_CODE_PREFIX:SEPAY}
app.sepay.webhook-bank-account=${SEPAY_WEBHOOK_BANK_ACCOUNT:}
