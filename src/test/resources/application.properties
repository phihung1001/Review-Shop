spring.datasource.url=jdbc:h2:mem:review_shop_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
app.auth.rate-limit-enabled=false
app.password-reset.otp-ttl-minutes=30
app.password-reset.otp-pepper=test-only-otp-pepper-with-at-least-32-bytes
app.password-reset.minimum-response-millis=0
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.issuer=review-shop-backend-test
app.jwt.audience=review-shop-api-test
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=30
app.jwt.refresh-cookie-name=refresh_token
app.jwt.refresh-cookie-secure=false 
app.jwt.csrf-cookie-name=csrf_token
app.payout.encryption-key=test-payout-key-exactly-32-byte!
app.payout.withdrawal-minimum=10000.00
app.payout.withdrawal-fee=5000.00
app.job-assignment.claim-ttl-minutes=10
app.job-assignment.expiry-cleanup-cron=0 0 0 1 1 *
app.storage.r2.endpoint=https://test.r2.cloudflarestorage.com
app.storage.r2.access-key=test-access-key
app.storage.r2.secret-key=test-secret-key
app.storage.r2.bucket=test-bucket
app.storage.r2.region=auto
app.storage.r2.upload-url-duration=PT10M
app.storage.r2.download-url-duration=PT30M
app.storage.r2.max-image-size=3145728
